[package]
name = "blinkd"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Blink node daemon — manages game server containers on a node"
license = "GPL-3.0"
authors = ["aarvsn"]
repository = "https://github.com/aarvsn/blink"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
bollard = "0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
sysinfo = "0.32"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2"
walkdir = "2"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
